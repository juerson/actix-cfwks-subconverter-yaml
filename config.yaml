    cipher: zero                                    # 可选修改这里
    udp: false
    tls: true
    skip-cert-verify: true
    servername: vmess.example.com                   # 修改这里
    network: xhttp
    xhttp-opts:
      host: vmess.example.com                       # 修改这里
      mode: stream-one
      path: /                                       # 修改这里
    alpn:
