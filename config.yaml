  - name: vless-ws-tls
    server: ""
    port: 443
    type: vless
    uuid: 0195cf0e-1b62-7ecf-892e-3bc510e47915      # 修改这里
    network: ws
    udp: false
    tls: true
    servername: vless.example.com                   # 修改这里
    client-fingerprint: chrome
    skip-cert-verify: true
    ws-opts:
      path: /                                       # 修改这里
      headers:
        Host: vless.example.com                     # 修改这里

  # id 3：clash核心不支持trojan-ws，只支持trojan-ws-tls
  - name: trojan-ws-tls
    server: ""
    port: 443
    type: trojan
    password: 0195cf0d-f3f8-72f4-80dc-5385831c8dfa  # 修改这里
    network: ws
    udp: false
    sni: trojan.example.com                         # 修改这里
    client-fingerprint: chrome
    skip-cert-verify: true
    ws-opts:
      path: /                                       # 修改这里
      headers:
        Host: trojan.example.com                    # 修改这里

