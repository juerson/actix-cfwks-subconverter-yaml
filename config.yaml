  # id 5
  - name: shadowsocks-ws-tls
    server: ""
    port: 443
    type: ss
    cipher: none                                    # 修改这里，可选：aes-128-gcm、aes-256-gcm、chacha20-ietf-poly1305、2022-blake3-aes-128-gcm、2022-blake3-aes-256-gcm、2022-blake3-chacha20-poly1305等
    password: a1234567                              # 修改这里
    udp: false
    plugin: v2ray-plugin
    plugin-opts:
      mode: websocket
      path: /                                       # 修改这里
      host: ss.example.com                          # 修改这里
      tls: true
      mux: false

