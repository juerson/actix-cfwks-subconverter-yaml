  # id 7
  - name: vmess-ws-tls
    port: 443
    server: ""
    type: vmess
    uuid: 0195cf0d-f3f8-72f4-80dc-5385831c8dfa      # 修改这里
    alterId: 0                                      # 这个不要自作聪明修改它，服务端不支持，会导致节点无法使用
    cipher: zero                                    # 可选修改这里
    udp: false
    tls: true
    skip-cert-verify: true
    servername: vmess.example.com                   # 修改这里
    network: ws
    ws-opts:
      path: /                                       # 修改这里
      headers:
        Host: vmess.example.com                     # 修改这里

  # id 8
  - name: vless-xhttp-tls
    server: ""
    port: 443
    type: vless
    uuid: 0195cf0e-1b62-7ecf-892e-3bc510e47915      # 修改这里
    network: xhttp
    udp: false
    tls: true                                       
    servername: vless.example.com                   # 修改这里
    client-fingerprint: chrome
    skip-cert-verify: true
    xhttp-opts:
      host: vless.example.com                       # 修改这里
      mode: stream-one
      path: /                                       # 修改这里
    alpn:
      - h2

# 目前mihomo只支持vless的xhttp配置，下面只是预测trojan和vmess的xhttp配置形式，是否被采纳这种格式，还未知，这里只用于转换为v2ray、sing-box

  # id 9
  - name: trojan-xhttp-tls
    server: ""
    port: 443
    type: trojan
    password: 0195cf0d-f3f8-72f4-80dc-5385831c8dfa  # 修改这里
    network: xhttp
    udp: false
    sni: trojan.example.com                         # 修改这里
    client-fingerprint: chrome
    skip-cert-verify: true
    xhttp-opts:
      host: trojan.example.com                      # 修改这里
      mode: stream-one
      path: /                                       # 修改这里
    alpn:
      - h2

  # id 10
  - name: vmess-xhttp-tls
    port: 443
    server: ""
    type: vmess
